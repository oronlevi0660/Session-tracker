<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעקב ססיות</title>

    body {

      background-color: #f4f4f9;

      padding: 10px;

    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header-box {
      background-color: #e3f2fd;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
      font-size: 22px;
      font-weight: bold;
      color: #0d47a1;
    }
    .btn-green {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .btn-green:hover { background-color: #1b5e20; }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .btn-purple {
      background-color: #7b1fa2;
      color: white;
      border: none;
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
      font-weight: bold;
    }
    .btn-purple:hover { background-color: #4a148c; }
    
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      background: #fafafa;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
    label {
      font-weight: bold;
      font-size: 14px;
    }
    input, select {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
    }
    
    .report-section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .report-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 10px;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #f5f5f5;
    }
