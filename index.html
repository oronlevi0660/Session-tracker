<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב ססיות ושעות נוספות</title>
    <!-- טעינת React 18 בצורה יציבה -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- טעינת Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- טעינת Babel לקומפילציה חלקה -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SESSION_TYPES = {
            A_SESSION: { name: 'ע ססיה', rate: 200, unit: 'שעות', isHourly: true, requireCoworker: false },
            KNEE: { name: 'ברכי', rate: 175, unit: 'מטופלות', isHourly: false, requireCoworker: true },
            MASKS: { name: 'מסיכות', rate: 400, unit: 'מטופלים', isHourly: false, requireCoworker: true },
            FRACTIONS: { name: 'פרקציות', rate: 143, unit: 'מטופלים', isHourly: false, requireCoworker: true },
            RADIO: { name: 'רדיו כירורגיה', rate: 216, unit: 'מטופלים', isHourly: false, requireCoworker: true },
            SIMULATION: { name: 'סימולציות', rate: 200, unit: 'סימולציות', isHourly: false, requireCoworker: true }
        };

        const COWORKERS = ['שרון', 'רותי', 'עמית', 'מיטל', 'קירה', 'ליאם', 'רישק', 'דורון', 'אבי', 'רותם', 'ברטה', 'סמדר'];

        function App() {
            const [entries, setEntries] = useState(() => {
                const saved = localStorage.getItem('sessions_data');
                return saved ? JSON.parse(saved) : [];
            });
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [sessionKey, setSessionKey] = useState('MASKS');
            const [count, setCount] = useState(1);
            const [coworker, setCoworker] = useState(COWORKERS[0]);
            const [alone, setAlone] = useState(false);
            const [isTaniaMode, setIsTaniaMode] = useState(false);

            useEffect(() => {
                localStorage.setItem('sessions_data', JSON.stringify(entries));
            }, [entries]);

            const currentSession = SESSION_TYPES[sessionKey];

            const handleAdd = () => {
                const targetCoworker = currentSession.requireCoworker ? (alone ? 'עבדתי לבד' : coworker) : '';
                
                const isDuplicate = entries.some(e => e.date === date && e.sessionKey === sessionKey);

                if (isDuplicate) {
                    const confirmAdd = window.confirm(`שים לב: כבר קיימת רשומת "${currentSession.name}" בתאריך הזה (${date}). האם אתה בטוח שאתה מוסיף את אותה ססיה פעמיים?`);
                    if (!confirmAdd) return;
                }

                const newEntry = {
                    id: Date.now(),
                    date,
                    sessionKey,
                    sessionName: currentSession.name,
                    count: Number(count),
                    rate: currentSession.rate,
                    total: Number(count) * currentSession.rate,
                    coworker: targetCoworker
                };
                setEntries([newEntry, ...entries]);
            };

            const handleDelete = (id) => {
                setEntries(entries.filter(e => e.id !== id));
            };

            const taniaSummary = entries.reduce((acc, entry) => {
                acc[entry.sessionName] = (acc[entry.sessionName] || 0) + entry.count;
                return acc;
            }, {});

            const totalEarnings = entries.reduce((sum, entry) => sum + entry.total, 0);

            return (
                <div className="max-w-md mx-auto p-4 space-y-6 pb-20">
                    <header className="bg-white p-4 rounded-xl shadow-sm border text-center">
                        <h1 className="text-xl font-bold text-slate-800">מעקב ססיות ושעות נוספות</h1>
                    </header>

                    {/* דוח לטניה */}
                    {isTaniaMode ? (
                        <div className="bg-white p-6 rounded-xl shadow-md border border-slate-200 space-y-4">
                            <div
