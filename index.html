<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב ססיות ושעות נוספות</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SESSION_TYPES = {
            A_SESSION: { name: 'ע ססיה', rate: 200, unit: 'שעות', isHourly: true, requireCoworker: false },
            KNEE: { name: 'ברכי', rate: 175, unit: 'מטופלות', isHourly: false, requireCoworker: true },
            MASKS: { name: 'מסיכות', rate: 400, unit: 'מטופלים', isHourly: false, requireCoworker: true },
            FRACTIONS: { name: 'פרקציות', rate: 143, unit: 'מטופלים', isHourly: false, requireCoworker: true },
            RADIO: { name: 'רדיו כירורגיה', rate: 216, unit: 'מטופלים', isHourly: false, requireCoworker: true },
            SIMULATION: { name: 'סימולציות', rate: 200, unit: 'סימולציות', isHourly: false, requireCoworker: true }
        };

        const COWORKERS = ['שרון', 'רותי', 'עמית', 'מיטל', 'קירה', 'ליאם', 'רישק', 'דורון', 'אבי', 'רותם', 'ברטה', 'סמדר'];

        function App() {
            const [entries, setEntries] = useState(() => {
                const saved = localStorage.getItem('sessions_data');
                return saved ? JSON.parse(saved) : [];
            });
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [sessionKey, setSessionKey] = useState('MASKS');
            const [count, setCount] = useState(1);
            const [coworker, setCoworker] = useState(COWORKERS[0]);
            const [alone, setAlone] = useState(false);
            const [isTaniaMode, setIsTaniaMode] = useState(false);

            useEffect(() => {
                localStorage.setItem('sessions_data', JSON.stringify(entries));
            }, [entries]);

            const currentSession = SESSION_TYPES[sessionKey];

            const handleAdd = () => {
                const newEntry = {
                    id: Date.now(),
                    date,
                    sessionKey,
                    sessionName: currentSession.name,
                    count: Number(count),
                    rate: currentSession.rate,
                    total: Number(count) * currentSession.rate,
                    coworker: currentSession.requireCoworker ? (alone ? 'עבדתי לבד' : coworker) : ''
                };
                setEntries([newEntry, ...entries]);
            };

            const handleDelete = (id) => {
                setEntries(entries.filter(e => e.id !== id));
            };

            const taniaSummary = entries.reduce((acc, entry) => {
                acc[entry.sessionName] = (acc[entry.sessionName] || 0) + entry.count;
                return acc;
            }, {});

            const totalEarnings = entries.reduce((sum, entry) => sum + entry.total, 0);

            return (
                <div class="max-w-md mx-auto p-4 space-y-6 pb-20">
                    <header class="bg-white p-4 rounded-xl shadow-sm border text-center">
                        <h1 class="text-xl font-bold text-slate-800">מעקב ססיות ושעות נוספות</h1>
                    </header>

                    {/* דוח לטניה */}
                    {isTaniaMode ? (
                        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 space-y-4">
                            <div class="flex justify-between items-center border-b pb-3">
                                <h2 class="text-lg font-bold text-slate-700">דוח לטניה - סיכום חודשי</h2>
                                <button onClick={() => setIsTaniaMode(false)} class="text-sm bg-slate-100 px-3 py-1 rounded-lg">סגור</button>
                            </div>
                            <table class="w-full text-right border-collapse">
                                <thead>
                                    <tr class="border-b bg-slate-50">
                                        <th class="p-2">סוג ססיה</th>
                                        <th class="p-2 text-left">כמות מצטברת</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {Object.entries(taniaSummary).map(([name, totalCount]) => (
                                        <tr key={name} class="border-b">
                                            <td class="p-2 font-medium">{name}</td>
                                            <td class="p-2 text-left">{totalCount}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    ) : (
                        <>
                            {/* טופס הזנה */}
                            <div class="bg-white p-4 rounded-xl shadow-sm border space-y-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">תאריך</label>
                                    <input type="date" value={date} onChange={e => setDate(e.target.value)} class="w-full p-2 border rounded-lg" />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">סוג ססיה</label>
                                    <select value={sessionKey} onChange={e => setSessionKey(e.target.value)} class="w-full p-2 border rounded-lg">
                                        {Object.entries(SESSION_TYPES).map(([k, v]) => (
                                            <option key={k} value={k}>{v.name} ({v.rate} ₪)</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">כמות ({currentSession.unit})</label>
                                    <input type="number" min="1" value={count} onChange={e => setCount(e.target.value)} class="w-full p-2 border rounded-lg" />
                                </div>

                                {currentSession.requireCoworker && (
                                    <div class="space-y-2">
                                        <label class="block text-sm font-medium">שותף/ה לעבודה</label>
                                        <div class="flex items-center space-x-2 space-x-reverse mb-2">
                                            <input type="checkbox" id="aloneCheck" checked={alone} onChange={e => setAlone(e.target.checked)} />
                                            <label htmlFor="aloneCheck" class="text-sm">עבדתי לבד</label>
                                        </div>
                                        {!alone && (
                                            <select value={coworker} onChange={e => setCoworker(e.target.value)} class="w-full p-2 border rounded-lg">
                                                {COWORKERS.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        )}
                                    </div>
                                )}

                                <button onClick={handleAdd} class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold shadow hover:bg-blue-700">הוסף ססיה</button>
                            </div>

                            <button onClick={() => setIsTaniaMode(true)} class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold shadow hover:bg-emerald-700">
                                📸 תצוגת דוח לטניה (צילום מסך)
                            </button>

                            {/* יומן דיווחים */}
                            <div class="bg-white p-4 rounded-xl shadow-sm border space-y-3">
                                <h3 class="font-bold border-b pb-2">יומן דיווחים (סה"כ: {totalEarnings} ₪)</h3>
                                {entries.map(e => (
                                    <div key={e.id} class="flex justify-between items-center p-3 bg-slate-50 rounded-lg text-sm border">
                                        <div>
                                            <div class="font-bold">{e.sessionName} - {e.count} {SESSION_TYPES[e.sessionKey]?.unit || ''}</div>
                                            <div class="text-xs text-slate-500">{e.date} {e.coworker ? `| עם: ${e.coworker}` : ''}</div>
                                        </div>
                                        <div class="flex items-center space-x-3 space-x-reverse">
                                            <span class="font-bold text-slate-700">{e.total} ₪</span>
                                            <button onClick={() => handleDelete(e.id)} class="text-red-500 text-xs">מחק</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
