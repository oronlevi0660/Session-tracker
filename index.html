    body {

      background-color: #f4f4f9;
      margin: 0;
      padding: 15px;
      direction: rtl;

    }
    .container {
      max-width: 800px;
      margin: auto;

      padding: 20px;
      border-radius: 8px;

    }
    h2, h3 {

      display: flex;

      background: #fafafa;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
    label {
      font-weight: bold;
      font-size: 14px;

      border: none;

      font-weight: bold;

    }
    button:hover {
      background-color: #0056b3;
    }
    .table-responsive {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      min-width: 500px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    .action-btns {
      display: flex;
      gap: 5px;
      justify-content: center;
    }
    .action-btns button {
      padding: 5px 8px;
      font-size: 12px;
      margin: 0;
      width: auto;
    }
    .btn-edit { background-color: #ffc107; color: black; }
    .btn-edit:hover { background-color: #e0a800; }
