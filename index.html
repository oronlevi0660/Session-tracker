<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעקב ססיות ושעות נוספות</title>
  <!-- טעינת Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      direction: rtl;
      text-align: right;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    form {
      display: grid;
      gap: 10px;
      margin-bottom: 20px;
      background: #fafafa;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
    label {
      font-weight: bold;
    }
    input, select, button {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    .action-btns button {
      padding: 5px 10px;
      font-size: 14px;
      margin: 0 2px;
    }
    .btn-edit { background-color: #ffc107; color: black; }
    .btn-delete { background-color: #dc3545; }
  </style>
</head>
<body>

<div class="container">
  <h2>מעקב ססיות ושעות נוספות</h2>

  <!-- טופס הוספה / עריכה -->
  <form id="sessionForm">
    <label for="inputDate">תאריך:</label>
    <input type="date" id="inputDate" required>

    <label for="inputType">סוג ססיה:</label>
    <select id="inputType" required>
      <option value="ע ססיה">ע ססיה</option>
      <option value="ברכי">ברכי</option>
      <option value="מסיכות">מסיכות</option>
      <option value="פרקציות">פרקציות</option>
      <option value="רדיו כירורגיה">רדיו כירורגיה</option>
      <option value="סימולציות">סי
